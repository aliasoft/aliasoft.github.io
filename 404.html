<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Aliasoft</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script>
    // SPA fallback pour GitHub Pages
    // Toute URL inconnue (ex: /agents-ia rechargée, ou ancienne URL Astro /fr/about/)
    // est réécrite vers / avec le path en hash, puis index.html intercepte et router-navigate
    (function () {
      var path = window.location.pathname + window.location.search + window.location.hash;
      // Évite la boucle : ne redirige pas si on est déjà sur /
      if (path !== '/') {
        sessionStorage.setItem('redirect', path);
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <noscript>
    <p>Cette page nécessite JavaScript. <a href="/">Retour à l'accueil Aliasoft</a></p>
  </noscript>
</body>
</html>
